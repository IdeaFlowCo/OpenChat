<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- interactive-widget=resizes-content asks the browser to actually shrink
         the layout viewport when the on-screen keyboard appears (rather than
         overlaying it). Combined with the --app-height JS in main.tsx (which
         tracks visualViewport for browsers that ignore this hint, like iOS
         Safari today), this prevents the chat area from sliding off-screen
         under the keyboard. See OpenChat-ka1. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="description" content="OpenChat — real-time messaging powered by the Global Brain" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="OpenChat" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>OpenChat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      Noos feedback widget. data-bottom-offset lifts the launcher above
      the chat composer on mobile + desktop so the floating button and
      panel don't overlap the Send button. See OpenChat-u7c.
    -->
    <script
      src="https://globalbr.ai/widget/noos-feedback.js?v=2.1"
      data-project="openchat"
      data-position="bottom-right"
      data-theme="auto"
      data-bottom-offset="80"
    ></script>
  </body>
</html>
