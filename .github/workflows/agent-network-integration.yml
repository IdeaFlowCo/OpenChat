name: Agent network integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  agent-network:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/openchat-test
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p openchat-test 'RETURN 1;'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NEO4J_TEST_URI: bolt://localhost:7687
      NEO4J_TEST_USER: neo4j
      NEO4J_TEST_PASSWORD: openchat-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # These suites share Neo4j schema; serialize files to avoid constraint-creation deadlocks.
      - name: Run focused agent-network tests against Neo4j
        run: >-
          ./node_modules/.bin/vitest run --no-file-parallelism --testTimeout=30000
          apps/server/test/agentNetwork.test.ts
          apps/server/test/agentNetwork.expiry.test.ts
          apps/server/test/agentNetwork.route.test.ts
          apps/server/test/agentNetwork.integration.test.ts
          apps/server/test/chatUnread.route.test.ts
          apps/server/test/chatUnread.integration.test.ts
          apps/server/test/chatMarkUnread.route.test.ts
          apps/server/test/unlinkedIdentities.integration.test.ts
          apps/server/test/unlinkedConnections.integration.test.ts
          apps/server/test/directConversationPrivacy.test.ts
          apps/server/test/privateGraph.test.ts
          apps/server/test/privateGraph.route.test.ts
          apps/server/test/privateGraph.scope.test.ts
          apps/server/test/ideaflowConnector.test.ts
          apps/server/test/ideaflowConnector.privateGraph.test.ts
          apps/server/test/privateNoteReview.test.ts
          apps/server/test/contacts.adapters.test.ts
          apps/server/test/contacts.errors.test.ts
          apps/server/test/contacts.http.test.ts
          apps/server/test/contacts.summary.test.ts
          apps/server/test/overlayVendor.test.ts
          apps/server/test/askPublications.route.test.ts
          apps/server/test/askPublications.service.test.ts
          apps/server/test/assistantAskPublication.test.ts
          apps/server/test/assistantAsks.test.ts
          apps/server/test/assistantTurnBoundary.test.ts
          apps/server/test/unlinkedProvision.test.ts

      # Native render suites require the server's automatic JSX transform.
      - name: Run canonical ask native render regressions
        working-directory: apps/server
        run: >-
          ../../node_modules/.bin/vitest run --no-file-parallelism
          test/askPublication.mobile.test.ts
          test/allAsks.mobile.test.ts

      # The overlay suites create schema on start; one file at a time avoids lock contention.
      - name: Run private-graph overlay and contact erasure suites against Neo4j
        run: >-
          ./node_modules/.bin/vitest run --no-file-parallelism
          apps/server/test/privateGraph.integration.test.ts
          apps/server/test/privateGraph.people.integration.test.ts
          apps/server/test/privateGraph.provenance.integration.test.ts
          apps/server/test/contacts.owner.integration.test.ts
          apps/server/test/privateNoteReview.integration.test.ts
          apps/server/test/privateAsks.integration.test.ts
          apps/server/test/askPublications.integration.test.ts
          apps/server/test/privateLists.integration.test.ts
          apps/server/test/importedChats.integration.test.ts
          apps/server/test/importedChatAccount.integration.test.ts
