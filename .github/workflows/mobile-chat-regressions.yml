name: Mobile chat regressions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  group-open:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Machine agent authorization and relay
        run: |
          node --import tsx --test scripts/machine-agent/*.test.mjs
          npm exec --workspace apps/server -- vitest run test/machineAgent.mobile.test.ts test/securityEvent.test.ts test/ideaflowAuthRoutes.test.ts
      - name: Mobile typecheck
        run: npx tsc --noEmit -p apps/mobile/tsconfig.json
      - name: Mobile design-token lint (no new fontSize/radius/hex literals)
        run: npm run lint --workspace=apps/mobile
      - name: Mobile permission and share utilities
        run: npm run test --workspace=apps/mobile
      - name: Group opening, message loading, and contact card privacy
        working-directory: apps/server
        run: >-
          npx vitest run test/appStamp.mobile.test.ts test/themePreference.mobile.test.ts test/groupOpen.mobile.test.ts test/chatLoading.mobile.test.ts test/chatRowRenders.mobile.test.ts
          test/offlineChat.test.ts test/offlineShell.test.ts
          test/authenticatedRequests.mobile.test.ts
          test/translation.route.test.ts test/translation.mobile.test.ts
          test/notificationNavigation.mobile.test.ts test/chatScreenRouter.mobile.test.ts test/composeOnboarding.mobile.test.ts test/onboardingRouter.test.ts
          test/conversationThoughts.mobile.test.ts
          test/conversationDisplay.test.ts test/contactInvite.mobile.test.ts
          test/addMeCard.test.ts test/addMeCard.route.test.ts
          test/privateNames.route.test.ts test/privateNames.mobile.test.ts test/contactProfileDoors.mobile.test.ts test/compose.mobile.test.ts test/agentMarkdown.mobile.test.ts
          test/contextHostedReview.mobile.test.ts test/contextHostedApi.mobile.test.ts test/contextHosted.route.test.ts
          test/contextWebhookSetup.mobile.test.ts test/contextWebhooks.route.test.ts test/contextWebhookTransport.test.ts
          test/conversationContent.route.test.ts test/contextIntentions.mobile.test.ts
          test/importedChats.mobile.test.ts test/importedChats.test.ts
      - name: Beeper selected-chat client, GET-only adapter and secure-grant boundary
        working-directory: apps/server
        run: npx vitest run test/beeperClient.mobile.test.ts test/beeperReadIntent.mobile.test.ts test/beeperDesktopApi.test.ts test/beeperReadAuthority.test.ts test/beeperForegroundRunner.test.ts test/beeperRelayTransport.test.ts test/beeperForegroundCli.test.ts test/beeperCliRevocation.test.ts test/importedChats.test.ts
      - name: Beeper reply authority, native draft pins and uncertain-send outbox
        working-directory: apps/server
        run: npx vitest run test/beeperWriteAuthority.test.ts test/beeperSendOutbox.test.ts test/beeperReplies.mobile.test.ts test/beeperWriteRunner.test.ts
      - name: Message status, agent actions, built-in agent, auto replies and message links
        working-directory: apps/server
        run: >-
          npx vitest run test/messageStatus.route.test.ts test/messageStatusControls.mobile.test.ts test/messageStatusChips.mobile.test.ts
          test/messageAgentActions.mobile.test.ts test/autoReplies.mobile.test.ts test/thoughtsDedupe.test.ts
          test/secretary.test.ts test/messagePermalinks.mobile.test.ts test/messageContext.mobile.test.ts
          test/messageContext.route.test.ts test/messageLinks.mobile.test.ts
          test/profileAgent.unit.test.ts test/profileAgent.route.test.ts test/profileAgent.mobile.test.ts
          test/messageId.unit.test.ts
      - name: Community access, account transitions and explicit group joins
        working-directory: apps/server
        run: npx vitest run test/communities.mobile.test.ts test/contextBackchannel.mobile.test.ts test/communityRefresh.mobile.test.ts test/streamLinks.mobile.test.ts test/communityMutationAuth.mobile.test.ts
      - name: Saved People pagination, virtualization, account isolation, and private cards
        working-directory: apps/server
        run: >-
          npx vitest run --no-file-parallelism
          test/contacts.pagination.api.test.ts test/contacts.pagination.mobile.test.ts
          test/contacts.evidence.mobile.test.ts
          test/privateGraph.mobile.test.ts
      - name: Unlinked confidential exchanges (session, recipient, identities) and compose entry
        working-directory: apps/server
        run: >-
          npx vitest run test/unlinkedSession.test.ts test/unlinkedMessaging.test.ts test/unlinkedIdentity.test.ts
          test/unlinkedIdentities.test.ts test/unlinkedCompose.test.ts
      - name: Ideaflow-only web sign-in, automatic sign-in, account switch, and native login parity
        working-directory: apps/server
        run: >-
          npx vitest run test/ideaflowOnlyLogin.mobile.test.ts test/signOut.mobile.test.ts
          test/loginGoogle.mobile.test.ts test/ideaflowAuthRoutes.test.ts test/ideaflowOidc.test.ts
          test/ideaflowAutoSignIn.mobile.test.ts

  private-names-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      neo4j:
        image: neo4j:5.26.0
        env:
          NEO4J_AUTH: neo4j/private-alias-test-only
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 256m
          NEO4J_server_memory_pagecache_size: 128m
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p private-alias-test-only 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Owner isolation, block safety, and card nonleakage on real Neo4j
        working-directory: apps/server
        env:
          NEO4J_TEST_URI: bolt://127.0.0.1:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: private-alias-test-only
        run: npx vitest run test/privateNames.integration.test.ts
      - name: Private message status, retry safety and source authorization on real Neo4j
        working-directory: apps/server
        env:
          NEO4J_TEST_URI: bolt://127.0.0.1:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: private-alias-test-only
        run: npx vitest run --testTimeout=30000 test/messageStatus.integration.test.ts test/messageStatusVisibility.integration.test.ts
      - name: Built-in agent privacy (private-note canaries), injection, cost cap and auto-responses on real Neo4j
        working-directory: apps/server
        env:
          NEO4J_TEST_URI: bolt://127.0.0.1:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: private-alias-test-only
        run: npx vitest run --testTimeout=30000 test/profileAgent.integration.test.ts
      - name: A client-chosen message id cannot address another message (real socket, route and Neo4j)
        working-directory: apps/server
        env:
          NEO4J_TEST_URI: bolt://127.0.0.1:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: private-alias-test-only
        run: npx vitest run --testTimeout=30000 test/messageIdCollision.integration.test.ts
      - name: Community membership, announcement authority and realtime revocation on real Neo4j
        working-directory: apps/server
        env:
          NEO4J_TEST_URI: bolt://127.0.0.1:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: private-alias-test-only
        run: npx vitest run --no-file-parallelism test/communities.integration.test.ts test/communityReviewFixes.integration.test.ts
      - name: Beeper owner isolation and transactional import receipts on real Neo4j
        working-directory: apps/server
        env:
          NEO4J_TEST_URI: bolt://127.0.0.1:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: private-alias-test-only
        run: npx vitest run --no-file-parallelism test/beeperRelay.integration.test.ts test/beeperReadFlow.integration.test.ts
      - name: Beeper ciphertext reply relay and real HTTP pinned-send recovery
        working-directory: apps/server
        env:
          NEO4J_TEST_URI: bolt://127.0.0.1:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: private-alias-test-only
        run: npx vitest run --no-file-parallelism test/beeperWrites.integration.test.ts test/beeperWriteFlow.integration.test.ts
      - name: Hosted Context private approval and durable worker on real Neo4j
        working-directory: apps/server
        env:
          NEO4J_TEST_URI: bolt://127.0.0.1:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: private-alias-test-only
        run: npx vitest run test/contextHosted.integration.test.ts

      - name: Context lifecycle, unified reads and webhook outbox on real Neo4j
        working-directory: apps/server
        env:
          NEO4J_TEST_URI: bolt://127.0.0.1:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: private-alias-test-only
        run: npx vitest run --no-file-parallelism test/contextIntentions.integration.test.ts test/agentNetwork.lifecycle.integration.test.ts test/conversationContent.integration.test.ts test/contextWebhooks.integration.test.ts test/peopleSuggestions.integration.test.ts
