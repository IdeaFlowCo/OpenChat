version: '3.8'

services:
  openchat:
    build: .
    container_name: openchat_app
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - PORT=4001
      - NEO4J_URI=${NEO4J_URI:-bolt://noos_neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - OC_BRIDGE_SECRET=${OC_BRIDGE_SECRET:-}
      - NOOS_API_URL=${NOOS_API_URL:-http://noos_api:4000/api}
      - NOOS_URL=${NOOS_URL:-https://globalbr.ai}
      # Canonical browser base for generated auth callback URLs.
      - OPENCHAT_URL=${OPENCHAT_URL:-https://chat.globalbr.ai}
      # Comma-separated browser origins allowed by Express and Socket.IO.
      - CORS_ORIGIN=${CORS_ORIGIN:-https://chat.globalbr.ai,https://social.globalbr.ai}
      # Web Push (OpenChat-3fw). Generate keys via `npx web-push generate-vapid-keys`.
      # docker-compose only forwards env vars explicitly listed here; without
      # this, the push service silently no-ops (graceful, but invisible).
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:dev@globalbr.ai}
      # Google OAuth (OpenChat-hwi). Client created in GCP project
      # boreal-conquest-464203-v2 ("Noos / OpenChat"). Secret lives in
      # the host .env for this docker-compose; same compose-forwarding
      # caveat as the VAPID vars above — must be listed here.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_IOS_CLIENT_ID=${GOOGLE_IOS_CLIENT_ID:-}
      # Agent API key encryption secret (OpenChat-7c9). 32-byte hex string.
      # Generate: openssl rand -hex 32 >> /opt/openchat/.env
      - OC_KEY_ENCRYPTION_SECRET=${OC_KEY_ENCRYPTION_SECRET:-}
      # Error notifier — Slack Incoming Webhook URL. When set, server-side
      # 5xx errors POST a rate-limited message to this URL (1 error per
      # signature per 60s). Unset = silent (existing docker logs unchanged).
      # See server/src/services/errorNotifier.ts.
      - SLACK_ERROR_WEBHOOK_URL=${SLACK_ERROR_WEBHOOK_URL:-}
      # Feedback -> WorldIssueTracker (oc8.3). Server turns in-app feedback into
      # WIT issues via this agent key. Unset = /api/feedback returns 503.
      # Set: echo 'WIT_AGENT_KEY=wit_...' >> /opt/openchat/.env
      - WIT_AGENT_KEY=${WIT_AGENT_KEY:-}
      - WIT_API_BASE=${WIT_API_BASE:-https://sthqnyjniclvnflfkyio.supabase.co/functions/v1}
      - WIT_SITE_URL=${WIT_SITE_URL:-https://worldissuetracker.com}
      # AI: message transforms (/api/ai), the in-app Assistant bot (bfn.3),
      # and semantic search embeddings (bfn.2). docker-compose only forwards
      # vars explicitly listed here — without these the values in the host
      # .env never reach the container (Assistant logs "ANTHROPIC_API_KEY not
      # set", embeddings silently no-op).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ASSISTANT_MODEL=${ASSISTANT_MODEL:-claude-haiku-4-5}
      # File/attachment storage (S3/GCS) for image + VOICE uploads. Same
      # compose-forwarding caveat: without these the presign endpoint 503s
      # ("File uploads are not configured") and voice/image attachments fail.
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-auto}
    networks:
      - app_network

networks:
  app_network:
    external: true
    name: noos_default
